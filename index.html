<!DOCTYPE html><html><head><meta charset="utf-8"><title>Layers</title>
<style>
body{margin:0;background:#111;height:100vh;overflow:hidden}
#hint{position:fixed;top:0;left:0;right:0;height:34px;line-height:34px;padding-left:14px;
background:#111;color:#999;font:13px "Courier New",monospace;z-index:999999}
img{position:absolute;background:#fff;cursor:pointer;
box-shadow:0 6px 24px #000;transition:box-shadow .4s}
img.on{box-shadow:0 0 36px 8px #ffd54a}
</style></head><body>
<div id="hint">click a page to hear it. click more to layer. refresh to rethrow</div>
<script>
const N=6, top0=40;
let z=1;
const rnd=(a,b)=>a+Math.random()*(b-a);
const cells=[0,1,2,3,4,5].sort(()=>Math.random()-.5);
const cw=innerWidth/3, ch=(innerHeight-top0)/2;
for(let i=0;i<N;i++){
  const img=document.createElement("img");
  img.src="Page"+(i+1)+".png";
  const w=Math.min(cw*1.1,ch*0.9)*rnd(.95,1.08), h=w*1.3;
  const c=cells[i], col=c%3, row=Math.floor(c/3);
  img.style.width=w+"px";
  img.style.left=(col*cw+cw/2-w/2+rnd(-30,30))+"px";
  img.style.top=(top0+row*ch+ch/2-h/2+rnd(-15,15))+"px";
  img.style.transform="rotate("+rnd(-14,14)+"deg)";
  img.style.zIndex=z++;
  const a=new Audio("voice"+(i+1)+".mp3");
  a.onended=()=>img.classList.remove("on");
  img.onclick=()=>{
    img.style.zIndex=++z;
    if(a.paused){
      img.classList.add("on");
      a.play().catch(()=>console.log("no audio yet: voice"+(i+1)+".mp3"));
    }else{a.pause();img.classList.remove("on");}
  };
  document.body.append(img);
}
</script></body></html>
